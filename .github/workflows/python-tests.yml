name: Python Tests

on:
  push:
    branches: [ main, develop, 'claude/**' ]
    paths:
      - 'pi-collector/**'
      - 'pi-streamer/**'
      - 'lambda/**'
      - 'tests/**'
      - '.github/workflows/python-tests.yml'
  pull_request:
    branches: [ main, develop ]

jobs:
  test-python:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.9', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov flake8 black mypy boto3 numpy

          # Install project dependencies
          if [ -f pi-collector/requirements.txt ]; then pip install -r pi-collector/requirements.txt; fi
          if [ -f pi-streamer/requirements.txt ]; then pip install -r pi-streamer/requirements.txt; fi

      - name: Lint with flake8
        run: |
          # Stop build if syntax errors or undefined names
          flake8 pi-collector pi-streamer lambda --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 pi-collector pi-streamer lambda --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
        continue-on-error: true

      - name: Check code formatting with black
        run: |
          black --check pi-collector pi-streamer lambda || true
        continue-on-error: true

      - name: Type check with mypy
        run: |
          mypy pi-collector pi-streamer lambda --ignore-missing-imports || true
        continue-on-error: true

      - name: Run unit tests
        run: |
          # Create tests directory if it doesn't exist
          mkdir -p tests

          # Run pytest if tests exist
          if [ -d "tests" ] && [ "$(ls -A tests/*.py 2>/dev/null)" ]; then
            pytest tests/ -v --cov=. --cov-report=xml --cov-report=term
          else
            echo "No tests found - skipping for now"
            echo "TODO: Add unit tests in tests/ directory"
          fi
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true
        if: matrix.python-version == '3.11'

  security-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Bandit security scanner
        run: |
          pip install bandit
          bandit -r pi-collector pi-streamer lambda -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json
        if: always()
